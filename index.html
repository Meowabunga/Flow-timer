
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090b0c">
<title>Flow Timer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--body1:#545b62;
--body2:#363c42;
--body3:#5b6269;
--edge:#858b91;
--knob:#f07d60;
--marker:#f07d60;
--ring1:#e0e3e2;
--ring2:#81898b;
--ring3:#c5cacc;
--wood:none;
}
html,body{
margin:0;width:100%;height:100%;
overflow:hidden;background:#090b0c;
color:#f4f6f2;
font-family:system-ui,-apple-system,sans-serif;
}
body{display:grid;place-items:center}
.device{
position:relative;
width:96vw;
height:min(94dvh,680px);
border:3px solid var(--edge);
border-radius:clamp(22px,4vw,52px);
background-image:var(--wood),linear-gradient(135deg,var(--body1),var(--body2) 48%,var(--body3));
background-size:100% 100%;
padding:clamp(12px,2.6vw,28px);
display:grid;
grid-template-columns:minmax(0,1fr) clamp(78px,14vw,155px);
gap:clamp(10px,2vw,25px);
box-shadow:inset 0 2px 5px #ffffff24,0 18px 50px #0008;
}
.display{
background:#07090a;
border:clamp(7px,1.3vw,15px) solid #242b2d;
border-radius:clamp(15px,3vw,37px);
display:flex;flex-direction:column;
min-width:0;overflow:hidden;
}
.phase{
flex:1;min-height:0;
display:flex;flex-direction:column;
justify-content:center;
padding:1% 5%;
cursor:pointer;
transition:opacity .15s;
}
.phase+.phase{border-top:2px solid #363a3b}
.phase:not(.selected){opacity:.33}
.tag{
color:#9baca9;
font-size:clamp(10px,2vw,22px);
font-weight:750;
letter-spacing:.24em;
}
.digits{
font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
font-variant-numeric:tabular-nums;
font-size:clamp(38px,10.5vmin,120px);
font-weight:500;
line-height:1.08;
letter-spacing:-.075em;
white-space:nowrap;
}
.controls{
display:flex;
flex-direction:column;
align-items:center;
justify-content:space-around;
padding-top:7%;
min-height:0;
}
.dial{
width:min(100%,23dvh);
aspect-ratio:1;
border-radius:50%;
position:relative;
touch-action:none;
cursor:grab;
border:clamp(6px,1.2vw,13px) solid transparent;
background:
linear-gradient(#30383d,#252c30) padding-box,
conic-gradient(from 20deg,
var(--ring1),var(--ring2),var(--ring3),
var(--ring1),var(--ring2),var(--ring1)) border-box;
box-shadow:
0 8px 14px #0008,
inset 0 0 0 3px #11191d,
0 0 0 3px #252c30;
}
.dial:active{cursor:grabbing}
.dial:after{
content:"";
position:absolute;
top:6%;left:50%;
transform:translateX(-50%);
width:8%;height:16%;
border-radius:10px;
background:var(--marker);
box-shadow:0 0 3px #0005;
}
.ctrl{
width:min(88%,17dvh);
aspect-ratio:1;
border:clamp(3px,.6vw,7px) solid #aab2b6;
border-radius:50%;
background:#333b40;
color:white;
font-size:clamp(27px,5vmin,56px);
display:grid;place-items:center;
cursor:pointer;
}
.ctrl:active{background:#56636b}
.preset{
width:100%;
border:1px solid #aab2b6;
border-radius:12px;
background:#20272b;
color:white;
font-size:clamp(11px,2.5vmin,22px);
font-weight:750;
padding:7px 2px;
touch-action:manipulation;
user-select:none;
-webkit-user-select:none;
}
.settings{
position:absolute;
top:2%;
right:2%;
width:clamp(32px,5.5vmin,65px);
aspect-ratio:1;
border-radius:50%;
border:1px solid #899397;
background:#242a2e;
color:white;
display:grid;
place-items:center;
padding:0;
cursor:pointer;
}
.settings svg{width:67%;height:67%}
.dialog{
border:2px solid #8d999d;
border-radius:20px;
background:#1c2428;
color:white;
padding:20px;
width:min(90vw,390px);
max-height:90dvh;
overflow:auto;
box-shadow:0 12px 70px #000;
}
.dialog::backdrop{background:#000b}
.dialog h2{margin:0 0 12px}
.dialog label{display:block;margin:12px 0}
.dialog input,.dialog select{
width:100%;
font-size:18px;
padding:9px;
background:#090d0f;
color:white;
border:1px solid #8d999d;
border-radius:8px;
}
.dialog input[type=color]{height:48px;padding:3px}
.dialog button{
padding:10px 16px;
margin:6px 4px 0 0;
border:0;border-radius:8px;
font-size:16px;
}
.status{
position:absolute;
bottom:3px;left:0;right:0;
text-align:center;
font-size:10px;
color:#8c9999;
pointer-events:none;
}
@media(orientation:portrait){
.device{
width:96vw;
height:min(65dvh,570px);
grid-template-columns:minmax(0,1fr) 17%;
padding:2%;gap:2%;
}
.digits{font-size:clamp(34px,9vw,100px)}
.tag{font-size:clamp(9px,2vw,17px)}
.dial{width:100%}
.ctrl{width:85%}
}
@media(orientation:landscape){
html,body{
width:100%;
height:100%;
margin:0;
}
body{display:block}
.device{
width:100%;
max-width:none;
height:100dvh;
margin:0;
border-radius:clamp(18px,3vw,42px);
}
.digits{font-size:min(17dvh,11vw)}
.status{display:none}
}
@media(max-height:340px) and (orientation:landscape){
.device{padding:8px;border-radius:18px}
.display{border-width:5px}
.digits{font-size:16dvh}
.tag{font-size:10px}
.ctrl{border-width:3px}
}
</style>
</head>
<body>

<main class="device" id="device">
<section class="display">
<div class="phase selected" id="focus" role="button" tabindex="0">
<div class="tag">FOCUS ◆</div>
<div class="digits" id="focusTime">25:00</div>
</div>
<div class="phase" id="break" role="button" tabindex="0">
<div class="tag">BREAK</div>
<div class="digits" id="breakTime">05:00</div>
</div>
</section>

<aside class="controls">
<div class="dial" id="dial" role="slider" tabindex="0" aria-label="Adjust minutes"></div>
<button class="ctrl" id="play" aria-label="Play or pause">▶</button>
<button class="ctrl" id="reset" aria-label="Reset selected timer">↻</button>
<button class="preset" id="preset">25 / 5</button>
</aside>

<button class="settings" id="settings" aria-label="Settings">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21h-4v-.04A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3.04 14H3v-4h.04A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88L4.2 7.06 7.06 4.2l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.04V3h4v.04A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1H21v4h-.04A1.7 1.7 0 0 0 19.4 15Z"/>
</svg>
</button>
</main>

<dialog class="dialog" id="settingsDialog">
<h2>Appearance</h2>
<label>Timer skin
<select id="skin">
<option value="gray">Original Gray</option>
<option value="maple">Maple</option>
<option value="oak">Oak</option>
<option value="walnut">Walnut</option>
<option value="cherry">Cherry</option>
<option value="espresso">Espresso</option>
<option value="ebony">Ebony</option>
<option value="custom">Custom Color</option>
</select>
</label>
<label>Custom body color
<input type="color" id="bodyColor" value="#545b62">
</label>
<label>Knob ring color
<input type="color" id="knobColor" value="#f07d60">
</label>
<p style="font-size:13px;color:#aab5b7">Original Gray restores the coral indicator. Wood finishes use a metallic ring, with your selected knob color applied to the indicator.</p>
<button id="closeSettings">Done</button>
</dialog>

<dialog class="dialog" id="presetDialog">
<form method="dialog" id="presetForm">
<h2>Timer presets</h2>
<label>Focus minutes
<input id="presetFocus" type="number" min="1" max="180" required>
</label>
<label>Break minutes
<input id="presetBreak" type="number" min="1" max="180" required>
</label>
<button value="cancel">Cancel</button>
<button value="save">Save</button>
</form>
</dialog>

<div class="status" id="status" aria-live="polite"></div>

<script>
(()=>{
"use strict";
const el=id=>document.getElementById(id);
const phases=["focus","break"];
const root=document.documentElement;

let duration={focus:25,break:5};
let remaining={focus:1500,break:300};
let presets={focus:25,break:5};
let selected="focus";
let running=false;
let deadline=0;
let tickId=null;
let audio=null;
let skin="gray";
let knobColor="#f07d60";
let customBody="#545b62";

function read(key){
try{return JSON.parse(localStorage.getItem(key)||"{}")}
catch(e){return {}}
}
function store(key,value){
try{localStorage.setItem(key,JSON.stringify(value))}
catch(e){}
}

const old=read("flowTimerPrefs");
const savedPresets=read("flowTimerPresets");
for(const p of phases){
if(Number.isInteger(old[p])&&old[p]>=1&&old[p]<=180){
duration[p]=old[p];
remaining[p]=old[p]*60;
}
if(Number.isInteger(savedPresets[p])&&savedPresets[p]>=1&&savedPresets[p]<=180)
presets[p]=savedPresets[p];
}

const appearance=read("flowTimerAppearance");
skin=appearance.skin||"gray";
knobColor=appearance.knob||"#f07d60";
customBody=appearance.body||"#545b62";

const woods={
maple:["#e2cba4","#bfa27b","#987b58"],
oak:["#c7a77a","#9e7b51","#765636"],
walnut:["#80604b","#523a2d","#30221c"],
cherry:["#ad6e50","#794431","#4d2a23"],
espresso:["#574337","#30241e","#1c1513"],
ebony:["#45403b","#252321","#131313"]
};

function grain(){
const lines=[];
for(let i=0;i<48;i++){
const y=i*2.2;
const drift=Math.sin(i*1.8)*1.5;
const thickness=i%7===0?1.2:.35;
const opacity=i%6===0?.16:.08;
lines.push(
`<path d="M-20 ${y} C 25 ${y+drift*2}, 55 ${y-drift*3}, 105 ${y+drift}" stroke="rgba(30,16,8,${opacity})" stroke-width="${thickness}" fill="none"/>`
);
}
const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 105" preserveAspectRatio="none">${lines.join("")}</svg>`;
return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

function shade(hex,amount){
const n=parseInt(hex.slice(1),16);
const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+amount)));
return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}

function applySkin(){
const isWood=!!woods[skin];
if(skin==="gray"){
root.style.setProperty("--body1","#545b62");
root.style.setProperty("--body2","#363c42");
root.style.setProperty("--body3","#5b6269");
root.style.setProperty("--edge","#858b91");
root.style.setProperty("--wood","none");
knobColor="#f07d60";
}else if(isWood){
const w=woods[skin];
root.style.setProperty("--body1",w[0]);
root.style.setProperty("--body2",w[1]);
root.style.setProperty("--body3",w[2]);
root.style.setProperty("--edge",w[0]);
root.style.setProperty("--wood",grain());
}else{
root.style.setProperty("--body1",shade(customBody,24));
root.style.setProperty("--body2",shade(customBody,-18));
root.style.setProperty("--body3",customBody);
root.style.setProperty("--edge",shade(customBody,35));
root.style.setProperty("--wood","none");
}
root.style.setProperty("--marker",knobColor);
root.style.setProperty("--knob",knobColor);

const darkWood=["walnut","espresso","ebony"].includes(skin);
if(darkWood){
root.style.setProperty("--ring1","#b6bbbd");
root.style.setProperty("--ring2","#535c60");
root.style.setProperty("--ring3","#8d969a");
}else{
root.style.setProperty("--ring1","#e0e3e2");
root.style.setProperty("--ring2","#81898b");
root.style.setProperty("--ring3","#c5cacc");
}
el("skin").value=skin;
el("knobColor").value=knobColor;
el("bodyColor").value=customBody;
store("flowTimerAppearance",{skin,knob:knobColor,body:customBody});
}

el("settings").onclick=()=>el("settingsDialog").showModal();
el("closeSettings").onclick=()=>el("settingsDialog").close();

el("skin").onchange=e=>{
skin=e.target.value;
applySkin();
};
el("knobColor").oninput=e=>{
knobColor=e.target.value;
root.style.setProperty("--marker",knobColor);
store("flowTimerAppearance",{skin,knob:knobColor,body:customBody});
};
el("bodyColor").oninput=e=>{
customBody=e.target.value;
skin="custom";
applySkin();
};

const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")}:${String(Math.max(0,s)%60).padStart(2,"0")}`;

function render(){
for(const p of phases){
el(p+"Time").textContent=fmt(remaining[p]);
el(p).classList.toggle("selected",p===selected);
}
el("preset").textContent=presets.focus+" / "+presets.break;
el("play").textContent=running?"Ⅱ":"▶";
el("dial").setAttribute("aria-valuenow",duration[selected]);
el("status").textContent=running?"Running "+selected:"Selected "+selected;
}
function saveDurations(){
store("flowTimerPrefs",duration);
}
function stop(){
running=false;
clearInterval(tickId);
}
function select(p){
if(running){sync();stop()}
selected=p;
render();
}
function adjust(n){
if(running){sync();stop()}
duration[selected]=Math.max(1,Math.min(180,duration[selected]+n));
remaining[selected]=duration[selected]*60;
saveDurations();
render();
}

function unlockAudio(){
try{
audio??=new(window.AudioContext||window.webkitAudioContext)();
if(audio.state==="suspended")audio.resume();
}catch(e){}
}

function beep(long){
if(!audio)return;
const start=audio.currentTime+.06;
const count=long?7:4;
const spacing=long?.48:.43;
const length=long?.34:.30;
for(let i=0;i<count;i++){
const o=audio.createOscillator();
const g=audio.createGain();
const t=start+i*spacing;
o.type="square";
o.frequency.value=long?650:880;
g.gain.setValueAtTime(.0001,t);
g.gain.exponentialRampToValueAtTime(.28,t+.025);
g.gain.setValueAtTime(.28,t+length-.055);
g.gain.exponentialRampToValueAtTime(.0001,t+length);
o.connect(g).connect(audio.destination);
o.start(t);
o.stop(t+length+.01);
}
}

function advance(){
beep(selected==="break");
selected=selected==="focus"?"break":"focus";
remaining[selected]=duration[selected]*60;
deadline=Date.now()+remaining[selected]*1000;
render();
}

function sync(){
if(!running)return;
let left=Math.ceil((deadline-Date.now())/1000);
if(left<=0){
advance();
left=remaining[selected];
}
remaining[selected]=left;
render();
}

function toggle(){
unlockAudio();
if(running){
sync();
stop();
}else{
running=true;
deadline=Date.now()+remaining[selected]*1000;
tickId=setInterval(sync,200);
}
render();
}

function reset(){
stop();
remaining[selected]=duration[selected]*60;
render();
}

for(const p of phases){
el(p).onclick=()=>select(p);
el(p).onkeydown=e=>{
if(e.key==="Enter"||e.key===" "){
e.preventDefault();
select(p);
}
};
}

el("play").onclick=toggle;
el("reset").onclick=reset;

function applyPreset(){
stop();
selected="focus";
for(const p of phases){
duration[p]=presets[p];
remaining[p]=duration[p]*60;
}
saveDurations();
render();
}

function editPreset(){
el("presetFocus").value=presets.focus;
el("presetBreak").value=presets.break;
el("presetDialog").showModal();
}

let holdTimer=null,held=false,holdStart=null;
const presetBtn=el("preset");
presetBtn.onpointerdown=e=>{
if(e.button!==0)return;
held=false;
holdStart={x:e.clientX,y:e.clientY};
clearTimeout(holdTimer);
holdTimer=setTimeout(()=>{
held=true;
editPreset();
},650);
};
presetBtn.onpointermove=e=>{
if(holdStart&&Math.hypot(e.clientX-holdStart.x,e.clientY-holdStart.y)>12)
clearTimeout(holdTimer);
};
for(const ev of ["pointerup","pointercancel","pointerleave"]){
presetBtn.addEventListener(ev,()=>{
clearTimeout(holdTimer);
holdStart=null;
});
}
presetBtn.oncontextmenu=e=>e.preventDefault();
presetBtn.onclick=e=>{
if(held){
e.preventDefault();
held=false;
return;
}
applyPreset();
};

el("presetForm").onsubmit=e=>{
if(e.submitter?.value!=="save")return;
const f=Number(el("presetFocus").value);
const b=Number(el("presetBreak").value);
if(!Number.isInteger(f)||!Number.isInteger(b)||f<1||b<1||f>180||b>180){
e.preventDefault();
return;
}
presets={focus:f,break:b};
store("flowTimerPresets",presets);
applyPreset();
};

let lastAngle=null,accum=0;
const angle=e=>{
const r=el("dial").getBoundingClientRect();
return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;
};

el("dial").onpointerdown=e=>{
unlockAudio();
lastAngle=angle(e);
accum=0;
el("dial").setPointerCapture(e.pointerId);
};
el("dial").onpointermove=e=>{
if(lastAngle===null)return;
let a=angle(e);
let delta=a-lastAngle;
if(delta>180)delta-=360;
if(delta< -180)delta+=360;
accum+=delta;
lastAngle=a;
const steps=Math.trunc(accum/18);
if(steps){
adjust(steps);
accum-=steps*18;
}
};
for(const event of ["pointerup","pointercancel","lostpointercapture"]){
el("dial").addEventListener(event,()=>lastAngle=null);
}
el("dial").onkeydown=e=>{
if(["ArrowUp","ArrowRight","ArrowDown","ArrowLeft"].includes(e.key)){
e.preventDefault();
adjust(["ArrowUp","ArrowRight"].includes(e.key)?1:-1);
}
};

document.addEventListener("visibilitychange",()=>{
if(!document.hidden)sync();
});

applySkin();
render();
})();
</script>
</body>
</html>
