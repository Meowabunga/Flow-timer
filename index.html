<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101214"><title>Flow Timer</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090a;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.device{--shell:#626a70;--knob:#ed8466;--grain:none;--indicator:#f6ddd2;--dial-ring:var(--knob);width:96vw;height:94dvh;display:grid;grid-template-columns:minmax(0,1fr) clamp(76px,15vw,155px);gap:clamp(8px,2vw,22px);padding:clamp(10px,2vw,24px);border:3px solid #ffffff45;border-radius:clamp(20px,4vw,45px);background-image:var(--grain),linear-gradient(125deg,#ffffff25,transparent 40%,#00000035),linear-gradient(var(--shell),var(--shell));box-shadow:inset 0 2px 5px #ffffff35,0 15px 40px #0008;position:relative}.screen{background:#07090a;border:clamp(6px,1.2vw,13px) solid #24292c;border-radius:clamp(14px,3vw,34px);display:flex;flex-direction:column;overflow:hidden;min-width:0}.phase{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:1% 5%;cursor:pointer}.phase+.phase{border-top:2px solid #363a3b}.phase:not(.active){opacity:.32}.tag{font-weight:750;color:#9baca9;letter-spacing:.2em;font-size:clamp(10px,2vw,20px)}.time{font:500 clamp(35px,10vmin,120px)/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.075em;white-space:nowrap;font-variant-numeric:tabular-nums}.controls{display:flex;flex-direction:column;align-items:center;justify-content:space-around;min-height:0;padding-top:clamp(34px,6dvh,75px)}.dial{width:min(100%,23dvh);aspect-ratio:1;border-radius:50%;border:clamp(6px,1.05vw,12px) solid var(--dial-ring);background:radial-gradient(circle at 35% 30%,#4b5358,#202528);box-shadow:0 6px 13px #0008,inset 0 2px 5px #0007;position:relative;touch-action:none}.dial:after{content:"";position:absolute;top:6%;left:50%;transform:translateX(-50%);height:17%;width:8%;border-radius:8px;background:var(--indicator)}.device.gray .dial{box-shadow:0 6px 13px #0008,inset 0 0 0 2px #e8e9e755,inset 0 4px 7px #00 </style></head><body><main class="device" id="device"><section class="screen"><div class="phase active" id="focus"><div class="tag">FOCUS ◆</div><div class="time" id="focusTime">25:00</div></div><div class="phase" id="break"><div class="tag">BREAK</div><div class="time" id="breakTime">05:00</div></div></section><aside class="controls"><button class="gear" id="settings" aria-label="Settings"><span aria-hidden="true">⚙</span></button><div class="dial" id="dial" role="slider" aria-label="Adjust selected minutes" tabindex="0"></div><button class="round" id="play" aria-label="Play or pause">▶</button><button class="round" id="reset" aria-label="Reset selected timer">↻</button><button class="preset" id="preset">25 / 5</button></aside></main><dialog class="sheet" id="options"><h2>Timer appearance</h2><label>Finish<select id="finish"><option value="gray">Original gray</option><option value="solid">Custom color</option><option value="maple">Maple</option><option value="oak">Oak</option><option value="walnut">Walnut</option><option value="cherry">Cherry</option><option value="espresso">Espresso</option><option value="ebony">Ebony</option></select></label><div class="row"><label>Body color<input id="bodyColor" type="color" value="#626a70"></label><label>Knob color<input id="knobColor" type="color" value="#ed8466"></label></div><p class="help">Wood finishes use generated CSS grain, so they work offline. Body color overrides the wood tone if you switch to Custom color.</p><button id="closeOptions">Done</button></dialog><dialog class="sheet" id="presetDialog"><h2>Timer presets</h2><label>Focus minutes<input id="presetFocus" type="number" min="1" max="180" inputmode="numeric"></label><label>Break minutes<input id="presetBreak" type="number" min="1" max="180" inputmode="numeric"></label><button id="savePreset">Save</button><button id="cancelPreset">Cancel</button></dialog><script>
(()=>{'use strict';const $=id=>document.getElementById(id),keys=['focus','break'];let mins={focus:25,break:5},left={focus:1500,break:300},presets={focus:25,break:5},selected='focus',running=false,deadline=0,interval=null,audio=null;const defaults={finish:'gray',bodyColor:'#626a70',knobColor:'#ed8466'};let skin={...defaults};function read(k,fallback){try{return JSON.parse(localStorage.getItem(k))||fallback}catch{return fallback}}function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}Object.assign(mins,read('flowTimerPrefs',{}));Object.assign(presets,read('flowTimerPresets',{}));Object.assign(skin,read('flowTimerSkin',{}));for(const k of keys){if(!Number.isInteger(mins[k])||mins[k]<1||mins[k]>180)mins[k]=25;if(!Number.isInteger(presets[k])||presets[k]<1||presets[k]>180)presets[k]=mins[k];left[k]=mins[k]*60}function render(){for(const k of keys){$(k+'Time').textContent=String(Math.floor(left[k]/60)).padStart(2,'0')+':'+String(left[k]%60).padStart(2,'0');$(k).classList.toggle('active',k===selected)}$('play').textContent=running?'Ⅱ':'▶';$('preset').textContent=presets.focus+' / '+presets.break;$('dial').setAttribute('aria-valuenow',mins[selected])}function stop(){running=false;clearInterval(interval);interval=null}function select(k){if(running){sync();stop()}selected=k;render()}function adjust(n){if(running){sync();stop()}mins[selected]=Math.max(1,Math.min(180,mins[selected]+n));left[selected]=mins[selected]*60;store('flowTimerPrefs',mins);render()}function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}function sound(isBreak){if(!audio)return;const count=isBreak?7:4,step=isBreak?.48:.43,len=isBreak?.34:.3;for(let i=0;i<count;i++){let t=audio.currentTime+.05+i*step,o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=isBreak?650:880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.28,t+.025);g.gain.setValueAtTime(.28,t+len-.055);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+len+.01)}}function sync(){if(!running)return;let now=Date.now(),guard=0;while(now>=deadline&&guard++<100){sound(selected==='break');selected=selected==='focus'?'break':'focus';deadline+=mins[selected]*60000}left[selected]=Math.max(0,Math.ceil((deadline-now)/1000));render()}function toggle(){unlock();if(running){sync();stop()}else{running=true;deadline=Date.now()+left[selected]*1000;interval=setInterval(sync,200)}render()}function reset(){stop();left[selected]=mins[selected]*60;render()}function applyPreset(){stop();selected='focus';for(const k of keys){mins[k]=presets[k];left[k]=mins[k]*60}store('flowTimerPrefs',mins);render()}function openPreset(){$('presetFocus').value=presets.focus;$('presetBreak').value=presets.break;$('presetDialog').showModal()}keys.forEach(k=>$(k).addEventListener('click',()=>select(k)));$('play').onclick=toggle;$('reset').onclick=reset;let hold=null,held=false,start=null;const p=$('preset');p.addEventListener('pointerdown',e=>{held=false;start=[e.clientX,e.clientY];hold=setTimeout(()=>{held=true;openPreset()},650)});p.addEventListener('pointermove',e=>{if(start&&Math.hypot(e.clientX-start[0],e.clientY-start[1])>12)clearTimeout(hold)});['pointerup','pointercancel','pointerleave'].forEach(x=>p.addEventListener(x,()=>{clearTimeout(hold);start=null}));p.addEventListener('contextmenu',e=>e.preventDefault());p.onclick=()=>{if(held){held=false;return}applyPreset()};$('savePreset').onclick=()=>{const f=Number($('presetFocus').value),b=Number($('presetBreak').value);if(!Number.isInteger(f)||!Number.isInteger(b)||f<1||b<1||f>180||b>180)return alert('Enter 1–180 minutes');presets={focus:f,break:b};store('flowTimerPresets',presets);$('presetDialog').close();applyPreset()};$('cancelPreset').onclick=()=>$('presetDialog').close();let angle=null,acc=0;const getAngle=e=>{const r=$('dial').getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI};$('dial').addEventListener('pointerdown',e=>{unlock();angle=getAngle(e);acc=0;$('dial').setPointerCapture(e.pointerId)});$('dial').addEventListener('pointermove',e=>{if(angle===null)return;let a=getAngle(e),d=a-angle;if(d>180)d-=360;if(d< -180)d+=360;acc+=d;angle=a;const steps=Math.trunc(acc/18);if(steps){adjust(steps);acc-=steps*18}});['pointerup','pointercancel','lostpointercapture'].forEach(x=>$('dial').addEventListener(x,()=>angle=null));$('dial').addEventListener('keydown',e=>{if(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();adjust(['ArrowUp','ArrowRight'].includes(e.key)?1:-1)}});
const woods={maple:'#d9bb8e',oak:'#b98a54',walnut:'#6b4430',cherry:'#a25c40',espresso:'#382820',ebony:'#252527'};// Irregular flowing wood grain, embedded as a lightweight SVG (no external assets).
const grainSvg=`<svg xmlns="http://www.w3.org/2000/svg" width="650" height="900" viewBox="0 0 650 900"><defs><filter id="soft"><feGaussianBlur stdDeviation="1.7"/></filter></defs><g fill="none" stroke-linecap="round">${Array.from({length:42},(_,i)=>{let x=i*18-35;let d=`M ${x} -30`;for(let y=0;y<=950;y+=38){let sway=Math.sin(y/105+i*.62)*9+Math.sin(y/47+i*.33)*3+Math.sin(y/260+i*.4)*16;d+=` L ${x+sway} ${y}`;}return `<path d="${d}" stroke="${i%4===0?'#fff':'#160c08'}" stroke-opacity="${i%4===0?'.11':'.17'}" stroke-width="${i%7===0?5:1.7}"/>`}).join('')}</g><g fill="none" stroke="#130a06" stroke-opacity=".16" stroke-width="2" filter="url(#soft)"><path d="M170 -30 C220 130 135 260 177 420 S240 740 175 950"/><path d="M450 -30 C400 160 490 270 450 470 S385 790 475 950"/></g></svg>`;
const grain='url("data:image/svg+xml,'+encodeURIComponent(grainSvg)+'")';function applySkin(){const wood=woods[skin.finish];$('device').classList.toggle('gray',skin.finish==='gray');$('device').style.setProperty('--shell',wood|| (skin.finish==='gray'?defaults.bodyColor:skin.bodyColor));$('device').style.setProperty('--grain',wood?grain:'none');$('device').style.setProperty('--knob',skin.knobColor);$('device').style.setProperty('--indicator',skin.knobColor);$('device').style.setProperty('--dial-ring',skin.finish==='gray'?'#c0c6c7':skin.knobColor);$('finish').value=skin.finish;$('bodyColor').value=skin.bodyColor;$('knobColor').value=skin.knobColor;store('flowTimerSkin',skin)}$('settings').onclick=()=>$('options').showModal();$('closeOptions').onclick=()=>$('options').close();$('finish').onchange=e=>{skin.finish=e.target.value;if(skin.finish==='gray'){skin.bodyColor=defaults.bodyColor;skin.knobColor=defaults.knobColor}applySkin()};$('bodyColor').oninput=e=>{skin.bodyColor=e.target.value;skin.finish='solid';applySkin()};$('knobColor').oninput=e=>{skin.knobColor=e.target.value;applySkin()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});applySkin();render()})();
</script></body></html>
